services:
  - type: web
    name: aws-cost-audit-backend
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        value: libsql://aws-cost-audit-danishkohale.aws-ap-northeast-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Grounded LLM narrative layer (optional). Set in the Render dashboard;
      # never commit the value. Missing ⇒ findings keep their rule-based text.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: poolside/laguna-s-2.1:free

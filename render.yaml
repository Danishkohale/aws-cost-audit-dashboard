services:
  - type: web
    name: aws-cost-audit-dashboard
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_DIR
        value: /data
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        value: libsql://aws-cost-audit-danishkohale.aws-ap-northeast-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false